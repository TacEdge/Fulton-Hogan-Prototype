name: Deploy prototype to GitHub Pages

# Publishes the built prototype to
# https://tacedge.github.io/Fulton-Hogan-Prototype/
#
# The site is served from a subdirectory, so VITE_BASE is set to match. Nothing
# else about the build differs from a local one.

on:
  push:
    branches:
      - main
      - claude/fulton-hogan-operational-prototype-hcfqp7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
